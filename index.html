<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Uber Eats 優惠","short_name":"UE優惠","start_url":"/","display":"standalone","background_color":"#ffffff","theme_color":"#06C167","icons":[{"src":"image_6.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="image_6.png">
    
    <style>
        :root { --ue-green: #06C167; --ue-black: #000000; --ue-white: #FFFFFF; }
        body { font-family: -apple-system, sans-serif; background: var(--ue-white); margin: 0; padding: 0; overflow: hidden; }

        /* 強制鎖定層 (無X按鈕) */
        #pwa-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        #pwa-overlay.hidden { display: none; }
        .pwa-logo { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        
        #android-btn { 
            background: var(--ue-black); color: white; border: none; 
            padding: 18px 0; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%;
            cursor: pointer; transition: 0.3s;
        }
        #android-btn:disabled { background: #eee; color: #aaa; cursor: not-allowed; }

        #ios-guide { display: none; width: 100%; }
        .ios-step { background: #f6f6f6; padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; text-align: left; font-size: 14px; }

        /* 主內容 */
        #main-content { display: none; }
        .header { position: sticky; top: 0; background: #fff; z-index: 100; border-bottom: 1px solid #eee; padding: 15px 20px; }
        .container { padding: 20px; background: #f6f6f6; min-height: 100vh; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="pwa-overlay">
    <img src="image_6.png" class="pwa-logo" alt="Logo">
    <h2 style="margin:0 0 10px; font-size: 24px;">系統鎖定</h2>
    <p style="color:#666; margin-bottom:40px; line-height: 1.6;">本工具僅限安裝至桌面後使用。<br>安裝後即可解鎖所有優惠碼。</p>

    <button id="android-btn" onclick="triggerAndroidInstall()" disabled>正在偵測安裝環境...</button>

    <div id="ios-guide">
        <div class="ios-step"><span>1. 點擊瀏覽器下方<strong>「分享」</strong>按鈕</span></div>
        <div class="ios-step"><span>2. 點擊<strong>「加入主螢幕」</strong>即可解鎖</span></div>
    </div>
</div>

<div id="main-content">
    <div class="header">
        <h1 style="margin:0; font-size:20px;">Uber Eats 優惠</h1>
    </div>
    <div class="container" id="list"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob))
            .then(() => console.log("SW 註冊成功"))
            .catch(err => console.log("SW 註冊失敗", err));
    }
</script>

<script>
    let deferredPrompt;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // 攔截安卓安裝事件
    window.addEventListener('beforeinstallprompt', (e) => {
        console.log("捕獲到安裝訊號！");
        e.preventDefault();
        deferredPrompt = e;
        
        // 訊號抓到了，讓按鈕亮起
        const btn = document.getElementById('android-btn');
        btn.disabled = false;
        btn.innerText = "一鍵安裝並解鎖";
    });

    function triggerAndroidInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    console.log('使用者接受安裝');
                }
            });
        }
    }

    // 檢查運行環境
    window.onload = () => {
        if (isStandalone) {
            // 已經從桌面開啟：解除鎖定
            document.getElementById('pwa-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.body.style.overflow = 'auto';
            if(typeof fetchData === 'function') fetchData(); 
        } else {
            // 還在瀏覽器：鎖定
            document.body.style.overflow = 'hidden';
            if (isIOS) {
                document.getElementById('android-btn').style.display = 'none';
                document.getElementById('ios-guide').style.display = 'block';
            } else {
                // 給安卓瀏覽器 5 秒緩衝抓訊號
                setTimeout(() => {
                    const btn = document.getElementById('android-btn');
                    if (btn.disabled) {
                        btn.disabled = false;
                        btn.innerText = "若無彈窗，請點此重新整理";
                        btn.onclick = () => location.reload();
                    }
                }, 5000);
            }
        }
    };
</script>

<script>
    function fetchData() {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
        fetch(csvUrl)
            .then(res => res.text())
            .then(csv => {
                const rows = csv.replace(/\r/g, '').split('\n').slice(1);
                const container = document.getElementById('list');
                container.innerHTML = '';
                
                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 4) return;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="font-size:24px; font-weight:800; color:#06C167;">${cols[3]}</div>
                        <div style="margin:8px 0; font-weight:600;">${cols[2]}</div>
                        <div style="font-size:12px; color:#999;">${cols[1]} | 期限: ${cols[0]}</div>
                    `;
                    container.appendChild(card);
                });
            });
    }
</script>

</body>
</html>
