<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="image_6.png">

    <style>
        :root { --ue-green: #06C167; --ue-black: #000000; --ue-white: #FFFFFF; }
        body { font-family: -apple-system, sans-serif; background: var(--ue-white); margin: 0; padding: 0; overflow: hidden; }

        /* 強制鎖定層 */
        #pwa-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        #pwa-overlay.hidden { display: none; }
        .pwa-logo { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        
        #android-btn { 
            background: var(--ue-black); color: white; border: none; 
            padding: 18px 0; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%;
            cursor: pointer; transition: 0.3s;
        }
        #android-btn:disabled { background: #eee; color: #aaa; cursor: not-allowed; }

        #ios-guide { display: none; width: 100%; }
        .ios-step { background: #f6f6f6; padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; text-align: left; font-size: 14px; }

        /* 主內容 */
        #main-content { display: none; }
        .header { position: sticky; top: 0; background: #fff; z-index: 100; border-bottom: 1px solid #eee; padding: 15px 20px; }
        .container { padding: 20px; background: #f6f6f6; min-height: 100vh; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .code { font-size: 24px; font-weight: 800; color: var(--ue-green); }
    </style>
</head>
<body>

<div id="pwa-overlay">
    <img src="image_6.png" class="pwa-logo" alt="Logo">
    <h2 style="margin:0 0 10px;">系統鎖定</h2>
    <p style="color:#666; margin-bottom:40px;">請先將此工具安裝至桌面<br>即可解鎖所有優惠代碼。</p>

    <button id="android-btn" onclick="triggerAndroidInstall()" disabled>偵測安裝環境中...</button>

    <div id="ios-guide">
        <div class="ios-step"><span>1. 點擊瀏覽器下方<strong>「分享」</strong>按鈕</span></div>
        <div class="ios-step"><span>2. 點擊<strong>「加入主螢幕」</strong>即可解鎖</span></div>
    </div>
</div>

<div id="main-content">
    <div class="header"><h1 style="margin:0; font-size:20px;">Uber Eats 優惠</h1></div>
    <div class="container" id="list"></div>
</div>

<script>
    // 1. 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Failed!', err));
    }

    let deferredPrompt;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // 2. 攔截安卓安裝事件
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('android-btn');
        btn.disabled = false;
        btn.innerText = "一鍵安裝並解鎖";
    });

    function triggerAndroidInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') console.log('User accepted install');
            });
        }
    }

    // 3. 初始檢查
    window.onload = () => {
        if (isStandalone) {
            document.getElementById('pwa-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            fetchData();
        } else {
            if (isIOS) {
                document.getElementById('android-btn').style.display = 'none';
                document.getElementById('ios-guide').style.display = 'block';
            } else {
                setTimeout(() => {
                    const btn = document.getElementById('android-btn');
                    if (btn.disabled) {
                        btn.disabled = false;
                        btn.innerText = "若無彈窗，請點此重整";
                        btn.onclick = () => location.reload();
                    }
                }, 5000);
            }
        }
    };

    // 4. 資料抓取
    function fetchData() {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
        fetch(csvUrl).then(res => res.text()).then(csv => {
            const rows = csv.replace(/\r/g, '').split('\n').slice(1);
            const container = document.getElementById('list');
            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length < 4) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="code">${cols[3]}</div><div style="margin:5px 0;">${cols[2]}</div><div style="font-size:12px; color:#999;">${cols[1]}</div>`;
                container.appendChild(card);
            });
        });
    }
</script>
</body>
</html>
