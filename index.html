<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠清單</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/b/b3/Uber_Eats_App_Icon.svg">
    
    <style>
        :root { 
            --ue-green: #06C167; --bg-dark: #121212; --card-bg: #1e1e1e;
            --text-main: #ffffff; --text-sub: #a0a0a0; --border-color: #333333; 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); margin: 0; padding: 0; color: var(--text-main); 
            -webkit-tap-highlight-color: transparent;
        }

        /* === 佔領螢幕的安裝面板 === */
        #install-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px; box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        #install-overlay.hidden { display: none; }
        .app-icon { width: 80px; height: 80px; background: #fff; border-radius: 20px; margin-bottom: 20px; padding: 10px; }
        .install-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .install-desc { color: var(--text-sub); margin-bottom: 40px; line-height: 1.6; }
        
        .btn-install { 
            background: var(--ue-green); color: white; border: none; 
            padding: 16px 40px; border-radius: 30px; font-size: 18px; font-weight: 700; 
            cursor: pointer; width: 100%; max-width: 280px; margin-bottom: 15px;
        }
        .btn-skip { color: #666; background: transparent; border: none; font-size: 14px; cursor: pointer; }

        /* === 主介面樣式 (縮減版) === */
        .header { position: sticky; top: 0; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .title-bar { padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .title-bar h1 { margin: 0; font-size: 22px; font-weight: 700; }
        .search-container { padding: 5px 20px 15px; }
        .search-box { width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        .filter-scroll { overflow-x: auto; white-space: nowrap; padding: 5px 20px; display: flex; gap: 8px; }
        .filter-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .filter-btn.active { background: rgba(6, 193, 103, 0.1); color: var(--ue-green); border-color: var(--ue-green); }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .card.used { opacity: 0.4; filter: grayscale(1); }
        .card-info { padding: 16px; }
        .code { font-size: 22px; font-weight: 700; color: var(--ue-green); }
        .desc { font-size: 14px; color: #ddd; margin-top: 8px; display: block; }
        .giant-btn { width: 100%; background: var(--ue-green); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .footer-reset { text-align: center; padding: 40px; }
        .reset-trigger { background: transparent; color: #555; border: 1px solid #333; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="install-overlay">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b3/Uber_Eats_App_Icon.svg" class="app-icon" alt="icon">
    <div class="install-title">安裝至桌面</div>
    <div class="install-desc">將此工具加入主螢幕<br>即可享受全螢幕、無廣告的極速體驗</div>
    <button class="btn-install" onclick="triggerInstall()">立即安裝</button>
    <button class="btn-skip" onclick="dismissInstall()">暫時不要，直接進入</button>
</div>

<div class="header">
    <div class="title-bar">
        <h1>Uber Eats 優惠</h1>
        <div style="font-size:12px; color:#666;">專業純淨版</div>
    </div>
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="搜尋代碼..." onkeyup="renderList()">
    </div>
    <div class="filter-scroll">
        <button class="filter-btn active" id="f-all" onclick="setFilter('all')">全部</button>
        <button class="filter-btn" id="f-new" onclick="setFilter('new')">新戶</button>
        <button class="filter-btn" id="f-vip" onclick="setFilter('vip')">會員</button>
    </div>
</div>

<div class="container" id="list"></div>

<div class="footer-reset">
    <button class="reset-trigger" onclick="localStorage.clear(); location.reload();">恢復原廠設定</button>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
    let allData = [];
    let currentFilter = 'all';
    let deferredPrompt;

    // --- 安裝功能邏輯 ---
    if (localStorage.getItem('pwa_installed') === 'true' || window.navigator.standalone) {
        document.getElementById('install-overlay').classList.add('hidden');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    dismissInstall();
                }
            });
        } else {
            alert("請點擊瀏覽器選單中的『加入主螢幕』按鈕進行安裝。");
            dismissInstall();
        }
    }

    function dismissInstall() {
        document.getElementById('install-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('install-overlay').classList.add('hidden');
            localStorage.setItem('pwa_installed', 'true'); // 永遠不再顯示
        }, 500);
    }

    // --- 核心資料邏輯 ---
    let usedCodes = JSON.parse(localStorage.getItem('ue_used') || '[]');

    fetch(csvUrl).then(res => res.text()).then(csv => {
        const rows = csv.split('\n').slice(1);
        allData = rows.map(row => {
            const cols = row.split(',');
            if (cols.length < 4) return null;
            return {
                end: cols[0], label: cols[1], desc: cols[2], code: cols[3].trim(),
                type: (cols[1]+cols[2]).includes('新') ? 'new' : (cols[1].includes('會員') ? 'vip' : 'hot')
            };
        }).filter(i => i);
        renderList();
    });

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('f-'+f).classList.add('active');
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = allData.filter(item => {
            const matchFilter = currentFilter === 'all' || item.type === currentFilter;
            const matchSearch = item.code.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
            return matchFilter && matchSearch;
        });

        filtered.forEach(item => {
            const isUsed = usedCodes.includes(item.code);
            const card = document.createElement('div');
            card.className = `card ${isUsed ? 'used' : ''}`;
            card.innerHTML = `
                <div class="card-info" onclick="copy('${item.code}')">
                    <div class="code">${item.code}</div>
                    <span class="desc">${item.desc}</span>
                    <div style="font-size:11px; color:#666; margin-top:10px;">期限: ${item.end}</div>
                </div>
                <button class="giant-btn" onclick="copy('${item.code}')">${isUsed ? '已領取' : '複製代碼'}</button>
            `;
            container.appendChild(card);
        });
    }

    function copy(code) {
        if (!usedCodes.includes(code)) {
            usedCodes.push(code);
            localStorage.setItem('ue_used', JSON.stringify(usedCodes));
        }
        navigator.clipboard.writeText(code).then(() => {
            renderList();
            setTimeout(() => { window.location.href = "ubereats://promotions"; }, 500);
        });
    }
</script>
</body>
</html>
