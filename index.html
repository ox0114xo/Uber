<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠</title>
    
    <link rel="manifest" href="data:application/manifest+json,{'name':'Uber Eats 優惠','short_name':'UE優惠','start_url':'.','display':'standalone','background_color':'#ffffff','theme_color':'#06C167','icons':[{'src':'image_6.png','sizes':'512x512','type':'image/png'}]}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="image_6.png">
    
    <style>
        :root { --ue-green: #06C167; --ue-black: #000000; --ue-white: #FFFFFF; --ue-gray-bg: #F6F6F6; }
        body { font-family: -apple-system, sans-serif; background-color: var(--ue-white); margin: 0; padding: 0; overflow: hidden; }

        /* 強制鎖定層 */
        #pwa-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        #pwa-overlay.hidden { display: none; }
        .pwa-logo { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .pwa-title { font-size: 24px; font-weight: 800; margin-bottom: 15px; color: #000; }
        
        /* 安卓發光按鈕 */
        #android-btn { 
            background: var(--ue-black); color: white; border: none; 
            padding: 18px 0; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%;
            cursor: pointer; box-shadow: 0 0 20px rgba(6,193,103,0.3);
        }

        #ios-guide { display: none; width: 100%; }
        .ios-step { background: var(--ue-gray-bg); padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; text-align: left; }

        #main-content { display: none; }
        .header { position: sticky; top: 0; background: #fff; z-index: 100; border-bottom: 1px solid #eee; padding: 15px 20px; }
        .container { padding: 20px; background: var(--ue-gray-bg); min-height: 100vh; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .code { font-size: 24px; font-weight: 800; color: var(--ue-green); }
        .copy-btn { width: 100%; background: var(--ue-green); color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 700; margin-top: 15px; }
    </style>
</head>
<body>

<div id="pwa-overlay">
    <img src="image_6.png" class="pwa-logo" alt="Logo">
    <div class="pwa-title">系統鎖定</div>
    <p style="color:#666; margin-bottom:40px;">本工具僅限安裝至桌面後解鎖。<br>點擊下方按鈕一鍵完成安裝。</p>

    <button id="android-btn" onclick="triggerAndroidInstall()">一鍵安裝並解鎖</button>

    <div id="ios-guide">
        <div class="ios-step"><span>1. 點擊瀏覽器下方<strong>「分享」</strong></span></div>
        <div class="ios-step"><span>2. 點擊<strong>「加入主螢幕」</strong></span></div>
    </div>
</div>

<div id="main-content">
    <div class="header"><h1 style="margin:0; font-size:22px;">Uber Eats 優惠</h1></div>
    <div class="container" id="list"></div>
</div>

<script>
    // --- 1. 核心 Service Worker 註冊 (安卓安裝必備) ---
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl);
    }

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
    let deferredPrompt;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // --- 2. 監聽安裝事件 (這是真正的自動觸發) ---
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e; // 攔截系統視窗，存起來等按鈕按
    });

    window.onload = () => {
        if (isStandalone) {
            document.getElementById('pwa-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.body.style.overflow = 'auto';
            fetchData();
        } else {
            document.body.style.overflow = 'hidden';
            if (isIOS) {
                document.getElementById('android-btn').style.display = 'none';
                document.getElementById('ios-guide').style.display = 'block';
            }
        }
    };

    function triggerAndroidInstall() {
        if (deferredPrompt) {
            // 這裡會直接彈出安卓系統的安裝對話框
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    alert("安裝中...請稍後從桌面打開。");
                }
            });
        } else {
            // 如果瀏覽器還沒準備好，通常是因為沒用 Chrome 或者網頁剛載入
            alert("系統初始化中，請確保使用 Chrome 瀏覽器並重整頁面後再試。");
        }
    }

    function fetchData() {
        fetch(csvUrl).then(res => res.text()).then(csv => {
            const rows = csv.split('\n').slice(1);
            const container = document.getElementById('list');
            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length < 4) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span class="code">${cols[3]}</span><div>${cols[2]}</div><button class="copy-btn" onclick="copy('${cols[3]}')">複製並跳轉</button>`;
                container.appendChild(card);
            });
        });
    }

    function copy(code) {
        navigator.clipboard.writeText(code).then(() => {
            window.location.href = "ubereats://promotions";
        });
    }
</script>
</body>
</html>
