<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠終端 | Pro Edition</title>
    <style>
        /* === 未來科技感配色 & 變數 === */
        :root { 
            --ue-green: #06C167; --ue-green-glow: rgba(6, 193, 103, 0.4);
            --bg-dark: #0a0a0c; --card-bg: #161618;
            --text-main: #ffffff; --text-sub: #9999a1;
            --border-color: #2a2a2e; --danger: #FF453A;
        }
        
        body { 
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-dark); margin: 0; padding: 0; color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; letter-spacing: 0.5px;
        }
        
        /* === 頂部科幻導航列 === */
        .header { 
            position: sticky; top: 0; background: rgba(10, 10, 12, 0.9); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 100; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .title-bar { padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .title-bar h1 { 
            margin: 0; font-size: 24px; font-weight: 900; 
            background: linear-gradient(90deg, #fff, var(--ue-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .stats-badge {
            font-size: 11px; background: #1f1f22; border: 1px solid #444;
            color: var(--text-sub); padding: 5px 12px; border-radius: 8px; font-weight: 800;
            display: flex; gap: 6px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .stats-badge span { color: var(--ue-green); font-size: 14px; text-shadow: 0 0 8px var(--ue-green-glow); }

        /* === 駭客搜索列 === */
        .search-container { padding: 5px 20px 15px; }
        .search-box {
            width: 100%; box-sizing: border-box; background: #000; border: 1px solid #444;
            color: var(--ue-green); padding: 14px 16px; border-radius: 10px; font-size: 15px;
            font-family: 'Courier New', Courier, monospace; outline: none; transition: 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .search-box:focus { border-color: var(--ue-green); box-shadow: 0 0 12px var(--ue-green-glow) inset; }
        .search-box::placeholder { color: #555; }

        /* === 控制台 (開關區) === */
        .control-panel { padding: 0 20px 15px; display: flex; flex-direction: column; gap: 12px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 10px; border: 1px solid #222; }
        .toggle-group { display: flex; align-items: center; gap: 10px; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid #555;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input:checked + .slider { background-color: var(--ue-green); border-color: var(--ue-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        .settings-text { font-size: 13px; color: #ccc; font-weight: 700; letter-spacing: 0.5px; }

        /* === 分類按鈕 (視覺大強化) === */
        .filter-scroll { 
            overflow-x: auto; white-space: nowrap; padding: 5px 20px 5px; 
            -webkit-overflow-scrolling: touch; display: flex; gap: 10px; scrollbar-width: none; 
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: #1a1a1c; color: #aaa; border: 1px solid #444;
            padding: 10px 18px; border-radius: 24px; font-size: 14px; font-weight: 800; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); letter-spacing: 0.5px;
        }
        .filter-btn:active { transform: scale(0.95); }
        .filter-btn.active { 
            background: rgba(6, 193, 103, 0.15); color: var(--ue-green); border-color: var(--ue-green); 
            box-shadow: 0 0 15px var(--ue-green-glow) inset, 0 4px 10px rgba(6, 193, 103, 0.2);
        }

        /* === 列表容器 === */
        .container { max-width: 600px; margin: 0 auto; padding: 20px 20px 50px; }
        
        /* === 卡片設計 === */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 14px; margin-bottom: 18px; position: relative; overflow: hidden; 
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); animation: slideUp 0.4s ease backwards;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .glitch-anim { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; border-color: var(--ue-green); }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }

        .card.used { opacity: 0.45; filter: grayscale(1); border-color: #222; box-shadow: none; }
        .card.used .giant-btn { background: #2a2a2e; color: #777; box-shadow: none; }

        .card-info { padding: 18px; cursor: pointer; }
        .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .code { font-size: 26px; font-weight: 900; color: var(--ue-green); font-family: 'Courier New', monospace; text-shadow: 0 0 10px var(--ue-green-glow); letter-spacing: 1px; }
        
        .share-btn {
            background: #222; border: 1px solid #444; color: #fff; border-radius: 50%; width: 36px; height: 36px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .share-btn:active { background: var(--ue-green); color: #000; border-color: var(--ue-green); transform: scale(0.9); }

        .tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag { font-size: 11px; padding: 5px 8px; border-radius: 6px; font-weight: 800; letter-spacing: 0.5px; }
        .tag-scope { background: #2a2a2e; color: #fff; border: 1px solid #444; }
        .tag-date { background: rgba(255, 69, 58, 0.15); color: var(--danger); border: 1px solid rgba(255,69,58,0.3); }

        .desc { font-size: 15px; color: #d1d1d6; line-height: 1.5; font-weight: 600; }

        /* 大按鈕強化 */
        .giant-btn {
            width: 100%; background: var(--ue-green); color: #000; border: none; padding: 16px 0; font-size: 16px; font-weight: 900;
            text-align: center; letter-spacing: 3px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: inset 0 -4px 10px rgba(0,0,0,0.2); /* 增加按鈕內層次感 */
        }
        .giant-btn:active { background: #05a859; box-shadow: inset 0 4px 10px rgba(0,0,0,0.4); transform: scale(0.99); }
        
        .reset-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; background: #111; color: #777;
            border: 1px dashed #444; padding: 16px 0; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 40px; transition: 0.3s;
        }
        .reset-btn:active { background: rgba(255, 69, 58, 0.1); border-color: var(--danger); color: var(--danger); }

        .loading { text-align: center; color: var(--ue-green); padding: 50px; font-size: 15px; font-weight: bold; letter-spacing: 1.5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        .toast { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: var(--ue-green); color: #000; padding: 14px 28px; border-radius: 30px; 
            font-size: 15px; font-weight: 900; opacity: 0; transition: 0.4s; pointer-events: none; z-index: 999; box-shadow: 0 10px 40px var(--ue-green-glow); white-space: nowrap; letter-spacing: 1px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="header">
    <div class="title-bar">
        <h1>UBER EATS PRO</h1>
        <div class="stats-badge">已破解 <span id="stats-count">0</span> 組</div>
    </div>
    
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="> 終端搜索 (如: 星巴克, 免運)..." onkeyup="handleSearch()">
    </div>

    <div class="control-panel">
        <div class="toggle-row">
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-new-user" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-new-user">過濾新戶優惠</span>
            </div>
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-hide-used" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-hide-used">隱藏已領取</span>
            </div>
        </div>
    </div>

    <div class="filter-scroll">
        <button class="filter-btn active" onclick="filter('all')">全終端 (<span id="count-all">0</span>)</button>
        <button class="filter-btn" onclick="filter('hot')">一般優惠</button>
        <button class="filter-btn" onclick="filter('vip')">尊榮會員</button>
        <button class="filter-btn" onclick="filter('new')">新進帳戶</button>
        <button class="filter-btn" onclick="filter('card')">金融聯名</button>
    </div>
</div>

<div class="container">
    <div id="list"><div class="loading">［ 正在連接雲端資料庫... ］</div></div>
    <button class="reset-btn" onclick="resetMemory()" id="reset-btn" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        清除終端記憶 (重置領取紀錄)
    </button>
</div>

<div id="toast" class="toast">⚡ 代碼破解成功</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
    
    let allData = [];
    let currentFilter = 'all';
    let searchQuery = '';

    let usedCodes = JSON.parse(localStorage.getItem('ue_used_codes')) || [];
    let isOldUser = localStorage.getItem('ue_is_old_user') === 'true';
    let isHideUsed = localStorage.getItem('ue_hide_used') === 'true';

    document.getElementById('toggle-new-user').checked = isOldUser;
    document.getElementById('toggle-hide-used').checked = isHideUsed;
    updateStats();

    fetch(csvUrl).then(res => res.text()).then(csvText => {
        const rows = csvText.replace(/\r/g, '').split('\n');
        allData = [];
        for (let i = 1; i < rows.length; i++) {
            let row = rows[i].trim();
            if (!row) continue;
            let cols = row.split(',');
            if (cols.length < 4) continue;
            
            const end = cols[0].trim(), label = cols[1].trim(), desc = cols[2].trim(), code = cols[3].trim();
            if (!code || code.toLowerCase() === '優惠碼') continue;

            // 🤖 終極版智能分類器 (修復新竹/新北 bug)
            let type = 'hot';
            let checkText = label + desc; 
            
            // 必須要是這幾個精準詞彙，才會被歸類為「新戶」
            if (checkText.includes('新戶') || checkText.includes('新客') || checkText.includes('首購')) {
                type = 'new';
            }
            else if (checkText.includes('會員') || checkText.includes('優市') || checkText.includes('自取')) {
                type = 'vip';
            }
            else if (checkText.includes('卡') || checkText.includes('台新') || checkText.includes('中信') || checkText.includes('國泰') || checkText.includes('富邦') || checkText.includes('聯名') || checkText.includes('銀行') || checkText.includes('金融')) {
                type = 'card';
            }

            allData.push({ id: i, code, desc, type, label, end });
        }
        document.getElementById('reset-btn').style.display = 'flex';
        renderList(currentFilter);
    }).catch(() => {
        document.getElementById('list').innerHTML = `<div class="loading" style="color:#FF453A">［ 連線失敗，請檢查網路 ］</div>`;
    });

    function handleSearch() {
        searchQuery = document.getElementById('search-input').value.toLowerCase();
        renderList(currentFilter);
    }

    function toggleSettings() {
        isOldUser = document.getElementById('toggle-new-user').checked;
        isHideUsed = document.getElementById('toggle-hide-used').checked;
        localStorage.setItem('ue_is_old_user', isOldUser);
        localStorage.setItem('ue_hide_used', isHideUsed);
        if (navigator.vibrate) navigator.vibrate(20);
        renderList(currentFilter);
    }

    function updateStats() {
        document.getElementById('stats-count').innerText = usedCodes.length;
    }

    function renderList(filterType) {
        currentFilter = filterType;
        const container = document.getElementById('list');
        container.innerHTML = '';
        
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.filter-btn[onclick="filter('${filterType}')"]`).classList.add('active');

        let processedData = allData;
        if (isOldUser) processedData = processedData.filter(item => item.type !== 'new');
        if (isHideUsed) processedData = processedData.filter(item => !usedCodes.includes(item.code));

        if (searchQuery) {
            processedData = processedData.filter(item => 
                item.desc.toLowerCase().includes(searchQuery) || 
                item.code.toLowerCase().includes(searchQuery) || 
                item.label.toLowerCase().includes(searchQuery)
            );
        }

        const finalData = filterType === 'all' ? processedData : processedData.filter(item => item.type === filterType);
        
        document.getElementById('count-all').innerText = processedData.length;

        if (finalData.length === 0) {
            container.innerHTML = '<div class="loading">［ 查無相符代碼 ］</div>';
            return;
        }

        finalData.forEach((item, index) => {
            let isUsed = usedCodes.includes(item.code);
            const card = document.createElement('div');
            card.className = `card ${isUsed ? 'used' : ''}`;
            card.id = `card-${item.id}`;
            card.style.animationDelay = `${index * 0.03}s`; 

            let shareHtml = navigator.share ? 
                `<div class="share-btn" onclick="shareCode(event, '${item.code}', '${item.desc}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </div>` : '';

            card.innerHTML = `
                <div class="card-info" onclick="copyCode('${item.code}', 'card-${item.id}')">
                    <div class="card-top-row">
                        <span class="code">${item.code}</span>
                        ${shareHtml}
                    </div>
                    <div class="tag-row">
                        <span class="tag tag-scope">${item.label}</span>
                        <span class="tag tag-date">⏳ ${item.end ? item.end : '即日起'}</span>
                    </div>
                    <span class="desc">${item.desc}</span>
                </div>
                <button class="giant-btn" onclick="copyCode('${item.code}', 'card-${item.id}')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    ${isUsed ? '已領取' : '一鍵破解'}
                </button>
            `;
            container.appendChild(card);
        });
    }

    window.filter = function(type) { renderList(type); }

    window.shareCode = function(e, code, desc) {
        e.stopPropagation(); 
        if (navigator.share) {
            navigator.share({
                title: '送你 Uber Eats 專屬優惠',
                text: `這組序號借你用！\n代碼：【 ${code} 】\n內容：${desc}`,
            }).catch(console.error);
        }
    }

    function copyCode(code, cardId) {
        const card = document.getElementById(cardId);
        
        card.classList.add('glitch-anim');
        setTimeout(() => card.classList.remove('glitch-anim'), 300);

        if (!usedCodes.includes(code)) {
            usedCodes.push(code);
            localStorage.setItem('ue_used_codes', JSON.stringify(usedCodes));
            updateStats();
        }

        card.classList.add('used');
        card.querySelector('.giant-btn').innerHTML = `已領取`;
        
        navigator.clipboard.writeText(code).then(() => {
            showToast('⚡ 破解完成，即將啟動 App...');
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]); 
            
            setTimeout(() => {
                window.location.href = "ubereats://promotions";
                if (isHideUsed) renderList(currentFilter); 
            }, 500);
        });
    }

    function resetMemory() {
        if (confirm("⚠️ 確定清除所有戰績與快取？")) {
            usedCodes = []; localStorage.removeItem('ue_used_codes');
            updateStats(); renderList(currentFilter); showToast('♻️ 系統已重置');
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
