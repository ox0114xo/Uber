<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="image_6.png">

    <style>
        :root { --ue-green: #06C167; --ue-black: #000000; --ue-white: #FFFFFF; --ue-gray: #F6F6F6; }
        body { font-family: -apple-system, sans-serif; background: var(--ue-white); margin: 0; padding: 0; overflow: hidden; }

        /* 強制鎖定層：不安裝就不能用 */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        .logo { width: 100px; height: 100px; border-radius: 22px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        #install-btn { 
            background: var(--ue-black); color: white; border: none; 
            padding: 18px 0; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%;
            cursor: pointer; transition: 0.3s;
        }
        #install-btn:disabled { background: #eee; color: #aaa; }

        /* 蘋果專用教學 */
        #apple-guide { display: none; width: 100%; margin-top: 20px; text-align: left; }
        .step { background: var(--ue-gray); padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }

        /* 主介面 */
        #app-content { display: none; }
        .header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #eee; padding: 15px 20px; }
        .container { padding: 20px; background: var(--ue-gray); min-height: 100vh; overflow-y: auto; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="lock-screen">
    <img src="image_6.png" class="logo">
    <h2 style="margin:0 0 10px;">系統鎖定</h2>
    <p style="color:#666; margin-bottom:40px;">為確保優惠即時更新，<br>請先將此工具安裝至桌面後使用。</p>

    <button id="install-btn" onclick="execInstall()" disabled>初始化安全模組中...</button>

    <div id="apple-guide">
        <div class="step">1. 點擊下方導覽列的<strong>「分享」</strong>圖示</div>
        <div class="step">2. 選擇<strong>「加入主螢幕」</strong>即可解鎖</div>
    </div>
</div>

<div id="app-content">
    <div class="header"><h1 style="margin:0; font-size:22px;">Uber Eats 優惠</h1></div>
    <div class="container" id="list"></div>
</div>

<script>
    // 1. 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log("SW Ready"));
    }

    let installEvent = null;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // 2. 攔截安卓安裝訊號
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        installEvent = e;
        const btn = document.getElementById('install-btn');
        btn.disabled = false;
        btn.innerText = "一鍵安裝至桌面";
    });

    function execInstall() {
        if (installEvent) {
            installEvent.prompt();
            installEvent.userChoice.then(choice => {
                if (choice.outcome === 'accepted') console.log('User installed');
            });
        }
    }

    // 3. 狀態檢查
    window.onload = () => {
        if (isStandalone) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.body.style.overflow = 'auto';
            loadData();
        } else {
            if (isIOS) {
                document.getElementById('install-btn').style.display = 'none';
                document.getElementById('apple-guide').style.display = 'block';
            } else {
                // 給安卓 4 秒偵測環境
                setTimeout(() => {
                    const btn = document.getElementById('install-btn');
                    if (btn.disabled) {
                        btn.disabled = false;
                        btn.innerText = "環境異常，請點此重新整理";
                        btn.onclick = () => location.reload();
                    }
                }, 4000);
            }
        }
    };

    // 4. 抓取資料
    function loadData() {
        const csv = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
        fetch(csv).then(r => r.text()).then(t => {
            const rows = t.split('\n').slice(1);
            const list = document.getElementById('list');
            rows.forEach(r => {
                const c = r.split(',');
                if (c.length < 4) return;
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div style="font-size:24px; font-weight:800; color:#06C167;">${c[3]}</div><div style="margin:5px 0;">${c[2]}</div>`;
                list.appendChild(div);
            });
        });
    }
</script>
</body>
</html>
