<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Uber Eats 優惠","short_name":"UE優惠","start_url":"/","display":"standalone","background_color":"#ffffff","theme_color":"#06C167","icons":[{"src":"image_6.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="image_6.png">
    
    <style>
        :root { --ue-green: #06C167; --ue-black: #000000; --ue-white: #FFFFFF; }
        body { font-family: -apple-system, sans-serif; background-color: var(--ue-white); margin: 0; padding: 0; overflow: hidden; }

        #pwa-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        #pwa-overlay.hidden { display: none; }
        .pwa-logo { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        
        #android-btn { 
            background: var(--ue-black); color: white; border: none; 
            padding: 18px 0; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%;
            cursor: pointer; transition: 0.3s;
        }
        #android-btn:disabled { background: #ccc; cursor: not-allowed; }

        #ios-guide { display: none; width: 100%; }
        .ios-step { background: #f6f6f6; padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; text-align: left; }

        #main-content { display: none; }
        .container { padding: 20px; background: #f6f6f6; min-height: 100vh; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="pwa-overlay">
    <img src="image_6.png" class="pwa-logo" alt="Logo">
    <h2 style="margin:0 0 10px;">系統鎖定</h2>
    <p style="color:#666; margin-bottom:40px;">請先將此工具安裝至桌面<br>即可解鎖所有優惠代碼。</p>

    <button id="android-btn" onclick="triggerAndroidInstall()" disabled>系統初始化中...</button>

    <div id="ios-guide">
        <div class="ios-step"><span>1. 點擊瀏覽器下方<strong>「分享」</strong>按鈕</span></div>
        <div class="ios-step"><span>2. 點擊<strong>「加入主螢幕」</strong></span></div>
    </div>
</div>

<div id="main-content">
    <div style="padding:15px 20px; border-bottom:1px solid #eee;">
        <h1 style="margin:0; font-size:20px;">Uber Eats 優惠清單</h1>
    </div>
    <div class="container" id="list"></div>
</div>

<script>
    // --- 1. Service Worker 強化 (確保快速啟用) ---
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => {
                e.waitUntil(self.skipWaiting());
            });
            self.addEventListener('activate', e => {
                e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    let deferredPrompt;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // --- 2. 核心：監聽安裝事件並啟用按鈕 ---
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('android-btn');
        btn.disabled = false;
        btn.innerText = "一鍵安裝並解鎖";
        console.log("安裝事件已捕獲");
    });

    window.onload = () => {
        if (isStandalone) {
            document.getElementById('pwa-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            fetchData();
        } else {
            if (isIOS) {
                document.getElementById('android-btn').style.display = 'none';
                document.getElementById('ios-guide').style.display = 'block';
            } else {
                // 安卓：給瀏覽器 3 秒鐘抓取訊號，如果抓不到再提示手動
                setTimeout(() => {
                    const btn = document.getElementById('android-btn');
                    if (btn.disabled) {
                        btn.disabled = false;
                        btn.innerText = "若無彈窗，請點此重整";
                        btn.onclick = () => location.reload();
                    }
                }, 4000);
            }
        }
    };

    function triggerAndroidInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    document.getElementById('android-btn').innerText = "正在安裝，請稍後...";
                }
            });
        }
    }

    function fetchData() {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
        fetch(csvUrl).then(res => res.text()).then(csv => {
            const rows = csv.split('\n').slice(1);
            const container = document.getElementById('list');
            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length < 4) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div style="font-size:24px; font-weight:800; color:#06C167;">${cols[3]}</div><div style="margin:5px 0;">${cols[2]}</div>`;
                container.appendChild(card);
            });
        });
    }
</script>
</body>
</html>
