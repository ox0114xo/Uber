<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 終端 | Genesis Edition</title>
    <style>
        /* === 創世變數 === */
        :root { 
            --ue-green: #06C167; --ue-green-glow: rgba(6, 193, 103, 0.6);
            --bg-dark: #070709; --card-bg: rgba(20, 20, 22, 0.85);
            --text-main: #ffffff; --text-sub: #888891;
            --border-color: #2a2a2e; --danger: #FF3B30;
            --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.5);
        }
        
        /* === 動態網格背景 === */
        body { 
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(6, 193, 103, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 193, 103, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            animation: gridMove 20s linear infinite;
            margin: 0; padding: 0; color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; letter-spacing: 0.5px;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 30px 30px; } }
        
        /* 上帝模式特效 (隱藏彩蛋) */
        body.god-mode {
            --ue-green: #FF3B30; --ue-green-glow: rgba(255, 59, 48, 0.6);
            background-image: radial-gradient(circle at center, rgba(255,59,48,0.1) 0%, transparent 100%),
            linear-gradient(rgba(255, 59, 48, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 59, 48, 0.05) 1px, transparent 1px);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* === 頂部導航 === */
        .header { 
            position: sticky; top: 0; background: rgba(7, 7, 9, 0.85); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 100; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .title-bar { padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .title-bar h1 { 
            margin: 0; font-size: 26px; font-weight: 900; 
            background: linear-gradient(90deg, #fff, var(--ue-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
        }
        
        .stats-badge {
            font-size: 11px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-sub); padding: 6px 14px; border-radius: 12px; font-weight: 800;
            display: flex; gap: 6px; align-items: center; backdrop-filter: blur(5px);
        }
        .stats-badge span { color: var(--ue-green); font-size: 15px; text-shadow: 0 0 10px var(--ue-green-glow); }

        .search-container { padding: 5px 20px 15px; }
        .search-box {
            width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid #333;
            color: var(--ue-green); padding: 14px 16px; border-radius: 12px; font-size: 15px;
            font-family: 'Courier New', Courier, monospace; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--ue-green); box-shadow: 0 0 15px var(--ue-green-glow) inset; background: rgba(6,193,103,0.05); }

        .control-panel { padding: 0 20px 15px; display: flex; flex-direction: column; gap: 12px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .toggle-group { display: flex; align-items: center; gap: 12px; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; border: 1px solid #444; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-radius: 50%; }
        input:checked + .slider { background-color: var(--ue-green); border-color: var(--ue-green); box-shadow: 0 0 15px var(--ue-green-glow); }
        input:checked + .slider:before { transform: translateX(20px); }
        .settings-text { font-size: 13px; color: #ccc; font-weight: 700; }

        .filter-scroll { overflow-x: auto; white-space: nowrap; padding: 5px 20px; -webkit-overflow-scrolling: touch; display: flex; gap: 10px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 800; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; backdrop-filter: blur(5px);
        }
        .filter-btn.active { background: rgba(6, 193, 103, 0.15); color: var(--ue-green); border-color: var(--ue-green); box-shadow: 0 0 20px var(--ue-green-glow) inset; transform: scale(1.05); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px; }
        
        /* === UR卡片流光特效 === */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 16px; margin-bottom: 20px; position: relative; overflow: hidden; 
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); animation: slideUp 0.5s ease backwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        
        /* 頂級閃卡 (包含免運或高額度) */
        .card.ur-tier {
            border: 1px solid var(--gold);
            box-shadow: 0 0 15px var(--gold-glow), inset 0 0 20px rgba(255,215,0,0.05);
            animation: urBreathing 3s infinite alternate, slideUp 0.5s ease backwards;
        }
        @keyframes urBreathing { 0% { box-shadow: 0 0 10px var(--gold-glow); } 100% { box-shadow: 0 0 25px rgba(255,215,0,0.8); } }
        
        /* 頂級閃卡背景光澤 */
        .card.ur-tier::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,215,0,0.1), transparent);
            transform: rotate(45deg); animation: urShine 3s infinite linear; pointer-events: none;
        }
        @keyframes urShine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }

        .glitch-anim { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; border-color: var(--ue-green); }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-3px, 3px) } 40% { transform: translate(-3px, -3px) } 60% { transform: translate(3px, 3px) } 80% { transform: translate(3px, -3px) } 100% { transform: translate(0) } }

        .card.used { opacity: 0.3; filter: grayscale(1); border-color: #111; box-shadow: none; }
        .card.used.ur-tier { border-color: #333; animation: none; }

        .card-info { padding: 20px; cursor: pointer; z-index: 2; position: relative; }
        .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .code { font-size: 28px; font-weight: 900; color: var(--ue-green); font-family: 'Courier New', monospace; text-shadow: 0 0 15px var(--ue-green-glow); letter-spacing: 2px; }
        .ur-tier .code { color: var(--gold); text-shadow: 0 0 15px var(--gold-glow); }
        
        .share-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
        .share-btn:active { background: var(--ue-green); color: #000; border-color: var(--ue-green); transform: scale(0.8); }

        .tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .tag { font-size: 11px; padding: 6px 10px; border-radius: 8px; font-weight: 800; letter-spacing: 1px; }
        .tag-scope { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .tag-date { background: rgba(255, 59, 48, 0.15); color: var(--danger); border: 1px solid rgba(255,59,48,0.3); }
        .ur-tier .tag-scope { background: rgba(255,215,0,0.15); color: var(--gold); border-color: rgba(255,215,0,0.4); }

        .desc { font-size: 16px; color: #eee; line-height: 1.6; font-weight: 600; }

        .giant-btn {
            width: 100%; background: var(--ue-green); color: #000; border: none; padding: 18px 0; font-size: 16px; font-weight: 900;
            text-align: center; letter-spacing: 4px; cursor: pointer; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 2; position: relative;
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.3); text-transform: uppercase;
        }
        .giant-btn:active { background: #00ff88; transform: scale(0.98); box-shadow: inset 0 5px 15px rgba(0,0,0,0.5); }
        .ur-tier .giant-btn { background: var(--gold); }
        .card.used .giant-btn { background: #1a1a1c; color: #555; }

        .reset-btn { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; background: rgba(255,255,255,0.03); color: #888; border: 1px dashed #444; padding: 18px 0; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 50px; transition: 0.3s; }
        .reset-btn:active { background: rgba(255, 59, 48, 0.15); border-color: var(--danger); color: var(--danger); }

        /* === 懸浮中樞按鈕 === */
        .fab {
            position: fixed; bottom: 30px; right: 20px; width: 50px; height: 50px;
            background: rgba(10,10,12,0.9); border: 2px solid var(--ue-green); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: var(--ue-green);
            box-shadow: 0 0 20px var(--ue-green-glow); cursor: pointer; opacity: 0; transform: translateY(20px);
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 99; backdrop-filter: blur(10px);
        }
        .fab.visible { opacity: 1; transform: translateY(0); }
        .fab:active { transform: scale(0.8); }

        .loading { text-align: center; color: var(--ue-green); padding: 80px 20px; font-size: 16px; font-weight: 900; letter-spacing: 2px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.2; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1.02); } }

        .toast { 
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%) translateY(30px) scale(0.9); 
            background: var(--ue-green); color: #000; padding: 16px 32px; border-radius: 40px; 
            font-size: 16px; font-weight: 900; opacity: 0; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            pointer-events: none; z-index: 999; box-shadow: 0 15px 50px var(--ue-green-glow); white-space: nowrap; letter-spacing: 2px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        
        /* 音頻授權提示 */
        .audio-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .audio-btn { background: var(--ue-green); color: #000; border: none; padding: 15px 40px; font-size: 18px; font-weight: 900; border-radius: 30px; margin-top: 20px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 30px var(--ue-green-glow); }
    </style>
</head>
<body>

<div id="audio-auth" class="audio-overlay">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--ue-green)" stroke-width="2" style="margin-bottom:20px; filter: drop-shadow(0 0 10px var(--ue-green));"><path d="M12 2v20M17 5v14M22 8v8M7 5v14M2 8v8"/></svg>
    <h2 style="color:white; margin:0 0 10px; font-size:24px;">創世終端已連線</h2>
    <p style="color:#aaa; font-size:14px; margin-bottom: 30px;">本系統配備全原生神經音效引擎<br>請授權啟動以獲得完整感官體驗</p>
    <button class="audio-btn" onclick="initSystem()">啟動系統 (INITIATE)</button>
</div>

<div class="header">
    <div class="title-bar">
        <h1 id="sys-title" onclick="triggerGodMode()">UBER EATS PRO</h1>
        <div class="stats-badge">駭入成功 <span id="stats-count">0</span></div>
    </div>
    
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="> 執行關鍵字檢索 (星巴克, 買一送一)..." onkeyup="handleSearch()">
    </div>

    <div class="control-panel">
        <div class="toggle-row">
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-new-user" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-new-user">過濾新進帳戶代碼</span>
            </div>
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-hide-used" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-hide-used">隱藏已駭入代碼</span>
            </div>
        </div>
    </div>

    <div class="filter-scroll">
        <button class="filter-btn active" onclick="filter('all')">全域網路 (<span id="count-all">0</span>)</button>
        <button class="filter-btn" onclick="filter('hot')">一般節點</button>
        <button class="filter-btn" onclick="filter('vip')">高階權限</button>
        <button class="filter-btn" onclick="filter('new')">新進節點</button>
        <button class="filter-btn" onclick="filter('card')">金融通道</button>
    </div>
</div>

<div class="container">
    <div id="list"><div class="loading">［ 正在同步全球伺服器資料庫... ］</div></div>
    <button class="reset-btn" onclick="resetMemory()" id="reset-btn" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        格式化記憶體 (清除所有駭入紀錄)
    </button>
</div>

<div class="fab" id="fab" onclick="window.scrollTo({top:0, behavior:'smooth'}); playSound(600, 'sine', 0.1);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
</div>

<div id="toast" class="toast">⚡ 代碼解析成功</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
    
    let allData = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let godModeClicks = 0;

    // --- Web Audio API 音效引擎 ---
    let audioCtx;
    function initSystem() {
        document.getElementById('audio-auth').style.display = 'none';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playSound(800, 'square', 0.1);
        setTimeout(() => playSound(1200, 'sine', 0.2), 100);
    }

    function playSound(freq, type, duration) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // 彩蛋：上帝模式
    function triggerGodMode() {
        godModeClicks++;
        playSound(400 + (godModeClicks * 100), 'sawtooth', 0.1);
        if (godModeClicks >= 5) {
            document.body.classList.add('god-mode');
            document.getElementById('sys-title').innerText = "SYSTEM OVERRIDE";
            playSound(150, 'sawtooth', 1); // 低頻狂暴音效
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
            showToast('⚠️ 警告：已進入超頻上帝模式');
            godModeClicks = 0; // 重置
        }
    }

    // 懸浮按鈕顯示邏輯
    window.onscroll = function() {
        const fab = document.getElementById('fab');
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) fab.classList.add('visible');
        else fab.classList.remove('visible');
    };

    let usedCodes = JSON.parse(localStorage.getItem('ue_used_codes')) || [];
    let isOldUser = localStorage.getItem('ue_is_old_user') === 'true';
    let isHideUsed = localStorage.getItem('ue_hide_used') === 'true';

    document.getElementById('toggle-new-user').checked = isOldUser;
    document.getElementById('toggle-hide-used').checked = isHideUsed;
    updateStats();

    fetch(csvUrl).then(res => res.text()).then(csvText => {
        const rows = csvText.replace(/\r/g, '').split('\n');
        allData = [];
        for (let i = 1; i < rows.length; i++) {
            let row = rows[i].trim();
            if (!row) continue;
            let cols = row.split(',');
            if (cols.length < 4) continue;
            
            const end = cols[0].trim(), label = cols[1].trim(), desc = cols[2].trim(), code = cols[3].trim();
            if (!code || code.toLowerCase() === '優惠碼') continue;

            let type = 'hot';
            let checkText = label + desc; 
            
            if (checkText.includes('新戶') || checkText.includes('新客') || checkText.includes('首購')) type = 'new';
            else if (checkText.includes('會員') || checkText.includes('優市') || checkText.includes('自取')) type = 'vip';
            else if (checkText.includes('卡') || checkText.includes('台新') || checkText.includes('中信') || checkText.includes('國泰') || checkText.includes('富邦') || checkText.includes('聯名') || checkText.includes('銀行')) type = 'card';

            // 🤖 AI 價值尋寶判定 (閃卡機制)
            let isUR = false;
            if (checkText.includes('免運') || checkText.includes('150') || checkText.includes('200') || checkText.includes('買一送一') || checkText.includes('五折') || checkText.includes('5折')) {
                isUR = true;
            }

            allData.push({ id: i, code, desc, type, label, end, isUR });
        }
        document.getElementById('reset-btn').style.display = 'flex';
        renderList(currentFilter);
    }).catch(() => {
        document.getElementById('list').innerHTML = `<div class="loading" style="color:#FF3B30">［ 伺服器連線中斷 ］</div>`;
    });

    function handleSearch() {
        searchQuery = document.getElementById('search-input').value.toLowerCase();
        playSound(600, 'square
