<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Eats 優惠終端 | Ultimate Edition</title>
    <style>
        /* === 未來科技感配色 & 變數 === */
        :root { 
            --ue-green: #06C167; --ue-green-glow: rgba(6, 193, 103, 0.4);
            --bg-dark: #0a0a0c; --card-bg: #141416;
            --text-main: #ffffff; --text-sub: #888890;
            --border-color: #222226; --danger: #FF453A;
        }
        
        body { 
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-dark); margin: 0; padding: 0; color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; letter-spacing: 0.5px;
        }
        
        /* === 頂部科幻導航列 === */
        .header { 
            position: sticky; top: 0; background: rgba(10, 10, 12, 0.85); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 100; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        
        .title-bar { padding: 16px 20px 5px; display: flex; justify-content: space-between; align-items: center; }
        .title-bar h1 { 
            margin: 0; font-size: 24px; font-weight: 900; 
            background: linear-gradient(90deg, #fff, var(--ue-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* 戰績面板 */
        .stats-badge {
            font-size: 11px; background: #1a1a1c; border: 1px solid #333;
            color: var(--text-sub); padding: 4px 10px; border-radius: 6px; font-weight: 800;
            display: flex; gap: 6px; align-items: center;
        }
        .stats-badge span { color: var(--ue-green); font-size: 13px; text-shadow: 0 0 5px var(--ue-green-glow); }

        /* === 駭客搜索列 === */
        .search-container { padding: 10px 20px; }
        .search-box {
            width: 100%; box-sizing: border-box; background: #000; border: 1px solid #333;
            color: var(--ue-green); padding: 12px 16px; border-radius: 8px; font-size: 14px;
            font-family: 'Courier New', Courier, monospace; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--ue-green); box-shadow: 0 0 10px var(--ue-green-glow) inset; }
        .search-box::placeholder { color: #444; }

        /* === 控制台 (開關區) === */
        .control-panel { padding: 0 20px 10px; display: flex; flex-direction: column; gap: 12px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; }
        .toggle-group { display: flex; align-items: center; gap: 10px; }
        
        /* 開關元件 */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid #555;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--ue-green); border-color: var(--ue-green); }
        input:checked + .slider:before { transform: translateX(18px); }
        .settings-text { font-size: 12px; color: var(--text-sub); font-weight: 600; }

        /* === 分類按鈕 === */
        .filter-scroll { 
            overflow-x: auto; white-space: nowrap; padding: 5px 20px; 
            -webkit-overflow-scrolling: touch; display: flex; gap: 8px; scrollbar-width: none; 
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: #111; color: var(--text-sub); border: 1px solid #333;
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; 
            transition: all 0.3s; cursor: pointer; 
        }
        .filter-btn.active { 
            background: rgba(6, 193, 103, 0.1); color: var(--ue-green); border-color: var(--ue-green); 
        }

        /* === 列表容器 === */
        .container { max-width: 600px; margin: 0 auto; padding: 15px 20px 40px; }
        
        /* === 卡片設計 === */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 12px; margin-bottom: 16px; position: relative; overflow: hidden; 
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); animation: slideUp 0.4s ease backwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 故障駭入特效 (Glitch) */
        .glitch-anim { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; border-color: var(--ue-green); }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .card.used { opacity: 0.4; filter: grayscale(1); border-color: #222; }
        .card.used .giant-btn { background: #222; color: #666; }

        .card-info { padding: 16px; }
        .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .code { font-size: 24px; font-weight: 900; color: var(--ue-green); font-family: 'Courier New', monospace; text-shadow: 0 0 8px var(--ue-green-glow); }
        
        /* 傳輸分享按鈕 */
        .share-btn {
            background: #222; border: 1px solid #444; color: #fff; border-radius: 50%; width: 32px; height: 32px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .share-btn:active { background: var(--ue-green); color: #000; border-color: var(--ue-green); transform: scale(0.9); }

        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .tag { font-size: 10px; padding: 4px 6px; border-radius: 4px; font-weight: 800; }
        .tag-scope { background: #222; color: #fff; }
        .tag-date { background: rgba(255, 69, 58, 0.15); color: var(--danger); }

        .desc { font-size: 14px; color: #ccc; line-height: 1.5; font-weight: 500; }

        .giant-btn {
            width: 100%; background: var(--ue-green); color: #000; border: none; padding: 14px 0; font-size: 15px; font-weight: 900;
            text-align: center; letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        
        .reset-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; background: transparent; color: #666;
            border: 1px dashed #444; padding: 14px 0; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 30px; transition: 0.3s;
        }
        .reset-btn:active { background: rgba(255, 69, 58, 0.1); border-color: var(--danger); color: var(--danger); }

        .loading { text-align: center; color: var(--ue-green); padding: 50px; font-size: 14px; font-weight: bold; letter-spacing: 1px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        .toast { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: var(--ue-green); color: #000; padding: 12px 24px; border-radius: 30px; 
            font-size: 14px; font-weight: 900; opacity: 0; transition: 0.4s; pointer-events: none; z-index: 999; box-shadow: 0 10px 30px var(--ue-green-glow); white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="header">
    <div class="title-bar">
        <h1>UBER EATS PRO</h1>
        <div class="stats-badge">已破解 <span id="stats-count">0</span> 組</div>
    </div>
    
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="> 輸入關鍵字搜索 (如: 星巴克, 免運)..." onkeyup="handleSearch()">
    </div>

    <div class="control-panel">
        <div class="toggle-row">
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-new-user" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-new-user">隱藏新戶優惠</span>
            </div>
            <div class="toggle-group">
                <label class="switch"><input type="checkbox" id="toggle-hide-used" onchange="toggleSettings()"><span class="slider"></span></label>
                <span class="settings-text" id="text-hide-used">隱藏已領取</span>
            </div>
        </div>
    </div>

    <div class="filter-scroll">
        <button class="filter-btn active" onclick="filter('all')">全終端 (<span id="count-all">0</span>)</button>
        <button class="filter-btn" onclick="filter('hot')">一般</button>
        <button class="filter-btn" onclick="filter('vip')">會員</button>
        <button class="filter-btn" onclick="filter('new')">新戶</button>
        <button class="filter-btn" onclick="filter('card')">信用卡</button>
    </div>
</div>

<div class="container">
    <div id="list"><div class="loading">［ 正在連接雲端資料庫... ］</div></div>
    <button class="reset-btn" onclick="resetMemory()" id="reset-btn" style="display: none;">清除終端記憶 (重置領取紀錄)</button>
</div>

<div id="toast" class="toast">⚡ 代碼複製成功</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQfG95R3C-8YZIhBsIJUOLckEq3MpPihSYVSszeOgx9jmdnXsyE9ag9NgBx4gbZOUg5-2-qxx7zQit/pub?output=csv';
    
    let allData = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // 讀取記憶
    let usedCodes = JSON.parse(localStorage.getItem('ue_used_codes')) || [];
    let isOldUser = localStorage.getItem('ue_is_old_user') === 'true';
    let isHideUsed = localStorage.getItem('ue_hide_used') === 'true';

    // 初始化介面
    document.getElementById('toggle-new-user').checked = isOldUser;
    document.getElementById('toggle-hide-used').checked = isHideUsed;
    updateStats();

    fetch(csvUrl).then(res => res.text()).then(csvText => {
        const rows = csvText.replace(/\r/g, '').split('\n');
        allData = [];
        for (let i = 1; i < rows.length; i++) {
            let row = rows[i].trim();
            if (!row) continue;
            let cols = row.split(',');
            if (cols.length < 4) continue;
            
            const end = cols[0].trim(), label = cols[1].trim(), desc = cols[2].trim(), code = cols[3].trim();
            if (!code || code.toLowerCase() === '優惠碼') continue;

            let type = 'hot';
            if (label.includes('新')) type = 'new';
            else if (label.includes('會員') || label.includes('優市') || label.includes('自取')) type = 'vip';
            else if (label.includes('卡') || label.includes('台新') || label.includes('中信') || label.includes('國泰')) type = 'card';

            allData.push({ id: i, code, desc, type, label, end });
        }
        document.getElementById('reset-btn').style.display = 'flex';
        renderList(currentFilter);
    }).catch(() => {
        document.getElementById('list').innerHTML = `<div class="loading" style="color:#FF453A">［ 連線失敗 ］</div>`;
    });

    function handleSearch() {
        searchQuery = document.getElementById('search-input').value.toLowerCase();
        renderList(currentFilter);
    }

    function toggleSettings() {
        isOldUser = document.getElementById('toggle-new-user').checked;
        isHideUsed = document.getElementById('toggle-hide-used').checked;
        localStorage.setItem('ue_is_old_user', isOldUser);
        localStorage.setItem('ue_hide_used', isHideUsed);
        if (navigator.vibrate) navigator.vibrate(20);
        renderList(currentFilter);
    }

    function updateStats() {
        document.getElementById('stats-count').innerText = usedCodes.length;
    }

    function renderList(filterType) {
        currentFilter = filterType;
        const container = document.getElementById('list');
        container.innerHTML = '';
        
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.filter-btn[onclick="filter('${filterType}')"]`).classList.add('active');

        // 1. 基本過濾 (新戶開關 & 隱藏已使用)
        let processedData = allData;
        if (isOldUser) processedData = processedData.filter(item => item.type !== 'new');
        if (isHideUsed) processedData = processedData.filter(item => !usedCodes.includes(item.code));

        // 2. 關鍵字搜索
        if (searchQuery) {
            processedData = processedData.filter(item => 
                item.desc.toLowerCase().includes(searchQuery) || 
                item.code.toLowerCase().includes(searchQuery) || 
                item.label.toLowerCase().includes(searchQuery)
            );
        }

        // 3. 分類按鈕
        const finalData = filterType === 'all' ? processedData : processedData.filter(item => item.type === filterType);
        
        document.getElementById('count-all').innerText = processedData.length;

        if (finalData.length === 0) {
            container.innerHTML = '<div class="loading">［ 查無相符代碼 ］</div>';
            return;
        }

        finalData.forEach((item, index) => {
            let isUsed = usedCodes.includes(item.code);
            const card = document.createElement('div');
            card.className = `card ${isUsed ? 'used' : ''}`;
            card.id = `card-${item.id}`;
            card.style.animationDelay = `${index * 0.03}s`; 

            // 分享按鈕 (防止觸發卡片點擊)
            let shareHtml = navigator.share ? 
                `<div class="share-btn" onclick="shareCode(event, '${item.code}', '${item.desc}')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </div>` : '';

            card.innerHTML = `
                <div class="card-info" onclick="copyCode('${item.code}', 'card-${item.id}')">
                    <div class="card-top-row">
                        <span class="code">${item.code}</span>
                        ${shareHtml}
                    </div>
                    <div class="tag-row">
                        <span class="tag tag-scope">${item.label}</span>
                        <span class="tag tag-date">⏳ ${item.end ? item.end : '即日起'}</span>
                    </div>
                    <span class="desc">${item.desc}</span>
                </div>
                <button class="giant-btn" onclick="copyCode('${item.code}', 'card-${item.id}')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    ${isUsed ? '已領取' : '一鍵破解'}
                </button>
            `;
            container.appendChild(card);
        });
    }

    window.filter = function(type) { renderList(type); }

    // 隱密傳輸 (Web Share API)
    window.shareCode = function(e, code, desc) {
        e.stopPropagation(); // 防止觸發外層的複製
        if (navigator.share) {
            navigator.share({
                title: '送你 Uber Eats 專屬優惠',
                text: `這組序號借你用！\n代碼：【 ${code} 】\n內容：${desc}`,
            }).catch(console.error);
        }
    }

    function copyCode(code, cardId) {
        const card = document.getElementById(cardId);
        
        // 加入 Glitch 特效
        card.classList.add('glitch-anim');
        setTimeout(() => card.classList.remove('glitch-anim'), 300);

        if (!usedCodes.includes(code)) {
            usedCodes.push(code);
            localStorage.setItem('ue_used_codes', JSON.stringify(usedCodes));
            updateStats();
        }

        card.classList.add('used');
        card.querySelector('.giant-btn').innerHTML = `已領取`;
        
        navigator.clipboard.writeText(code).then(() => {
            showToast('⚡ 破解完成，即將啟動 App...');
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // 特殊駭客震動
            
            setTimeout(() => {
                window.location.href = "ubereats://promotions";
                if (isHideUsed) renderList(currentFilter); // 如果開啟隱藏，點完跳轉後直接消失
            }, 500);
        });
    }

    function resetMemory() {
        if (confirm("⚠️ 確定清除所有戰績與快取？")) {
            usedCodes = []; localStorage.removeItem('ue_used_codes');
            updateStats(); renderList(currentFilter); showToast('♻️ 系統已重置');
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
